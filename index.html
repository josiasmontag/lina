<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Lina</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lina">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#120d12">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="version" content="dev">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #120d12; overflow: hidden; }
  body { position: fixed; inset: 0; touch-action: none; -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
  canvas { display: block; position: fixed; left: 0; top: 0; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; }
  #title {
    position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 13vh; box-sizing: border-box;
    font-family: 'Pixelify Sans', monospace; color: #fff; pointer-events: none;
    background: radial-gradient(ellipse at center, rgba(25,12,25,0.1), rgba(25,12,25,0.65));
    transition: opacity .8s;
  }
  #title h1 {
    font-size: min(26vw, 220px, 30vh); margin: 0; color: #f47aa0; font-weight: 700; letter-spacing: .04em;
    text-shadow: 0 .05em 0 #9b2d58, 0 .1em 0 #5a1734, 0 .16em .1em rgba(0,0,0,.4);
  }
  #title p { font-size: clamp(16px, 2.4vw, 28px); margin: .6em 0 0; animation: blink 1.4s infinite; text-shadow: 0 2px 0 rgba(0,0,0,.6); }
  @keyframes blink { 50% { opacity: .35; } }
  #help {
    position: fixed; left: 16px; bottom: 16px; font-family: 'Pixelify Sans', monospace; color: #fdf6e8;
    background: rgba(30,20,28,.78); border: 2px solid #6b4a3a; border-radius: 6px; padding: 10px 14px;
    font-size: 15px; line-height: 1.55; transition: opacity .6s; opacity: 0; pointer-events: none;
  }
  #help b { color: #ffd27a; font-weight: 700; }
  #help { left: max(16px, env(safe-area-inset-left)); bottom: max(16px, env(safe-area-inset-bottom)); }
  .touch-only, body.touch .key-only { display: none; }
  body.touch .touch-only { display: inline; }

  /* on-screen controls, shown once the game is touched */
  #touch { position: fixed; inset: 0; touch-action: none; display: none; }
  body.touch #touch { display: block; }
  #touch .stick, #touch .knob {
    position: absolute; left: 0; top: 0; border-radius: 50%; pointer-events: none; opacity: 0; transition: opacity .15s;
  }
  #touch .stick { width: 104px; height: 104px; margin: -52px 0 0 -52px; background: rgba(30,20,28,.35); border: 3px solid rgba(253,246,232,.45); box-sizing: border-box; }
  #touch .knob { width: 48px; height: 48px; margin: -24px 0 0 -24px; background: rgba(253,246,232,.7); box-shadow: 0 3px 0 rgba(0,0,0,.3); }
  #touch.active .stick, #touch.active .knob { opacity: 1; }
  #touch button {
    position: absolute; border-radius: 50%; border: 3px solid rgba(0,0,0,.35); padding: 0;
    font: 700 30px 'Pixelify Sans', monospace; color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.35);
    box-shadow: 0 5px 0 rgba(0,0,0,.35); opacity: .85; touch-action: none;
  }
  #touch button.down { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,.35); }
  #touch .a { width: 78px; height: 78px; right: max(24px, env(safe-area-inset-right)); bottom: calc(max(24px, env(safe-area-inset-bottom)) + 34px); background: #48c35c; }
  #touch .b { width: 62px; height: 62px; right: calc(max(24px, env(safe-area-inset-right)) + 92px); bottom: max(20px, env(safe-area-inset-bottom)); background: #e2336f; font-size: 24px; }
  #touch .music { width: 42px; height: 42px; right: max(16px, env(safe-area-inset-right)); top: max(16px, env(safe-area-inset-top)); background: rgba(30,20,28,.6); font-size: 20px; border-color: rgba(253,246,232,.4); box-shadow: none; }
  body.muted #touch .music { opacity: .4; }
  .hidden { opacity: 0 !important; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="title">
  <h1>Lina</h1>
  <p><span class="key-only">Press any key or Ⓐ to play</span><span class="touch-only">Tap to play</span></p>
</div>
<div id="touch">
  <div class="stick"></div><div class="knob"></div>
  <button class="b" data-action="bell" aria-label="Bell / hop">B</button>
  <button class="a" data-action="interact" aria-label="Bike, doors and play">A</button>
  <button class="music" data-action="music" aria-label="Music on/off">♪</button>
</div>
<div id="help">
  <span class="key-only">
  <b>Move</b> Arrows / WASD / Left stick<br>
  <b>Bike, doors &amp; play</b> E / Space / Ⓐ<br>
  <b>Bell / Hop</b> Q / Ⓑ<br>
  <b>Music</b> M · <b>Help</b> H
  </span><span class="touch-only">
  <b>Move</b> Drag anywhere<br>
  <b>Bike, doors &amp; play</b> Ⓐ<br>
  <b>Bell / Hop</b> Ⓑ
  </span>
</div>
<script>if (matchMedia('(pointer: coarse)').matches) document.body.classList.add('touch');</script>
<script src="js/util.js"></script>
<script src="js/audio.js"></script>
<script src="js/input.js"></script>
<script src="js/sprites.js"></script>
<script src="js/props.js"></script>
<script src="js/scenes.js"></script>
<script src="js/main.js"></script>
<script src="js/reload.js"></script>
</body>
</html>
