<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lina</title>
<meta name="version" content="dev">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #120d12; overflow: hidden; }
  canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
  #title {
    position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: 'Pixelify Sans', monospace; color: #fff; pointer-events: none;
    background: radial-gradient(ellipse at center, rgba(25,12,25,0.1), rgba(25,12,25,0.65));
    transition: opacity .8s;
  }
  #title h1 {
    font-size: min(26vw, 220px); margin: 0; color: #f47aa0; font-weight: 700; letter-spacing: .04em;
    text-shadow: 0 .05em 0 #9b2d58, 0 .1em 0 #5a1734, 0 .16em .1em rgba(0,0,0,.4);
  }
  #title p { font-size: clamp(16px, 2.4vw, 28px); margin: .6em 0 0; animation: blink 1.4s infinite; text-shadow: 0 2px 0 rgba(0,0,0,.6); }
  @keyframes blink { 50% { opacity: .35; } }
  #help {
    position: fixed; left: 16px; bottom: 16px; font-family: 'Pixelify Sans', monospace; color: #fdf6e8;
    background: rgba(30,20,28,.78); border: 2px solid #6b4a3a; border-radius: 6px; padding: 10px 14px;
    font-size: 15px; line-height: 1.55; transition: opacity .6s; opacity: 0; pointer-events: none;
  }
  #help b { color: #ffd27a; font-weight: 700; }
  .hidden { opacity: 0 !important; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="title">
  <h1>Lina</h1>
  <p>Press any key or Ⓐ to play</p>
</div>
<div id="help">
  <b>Move</b> Arrows / WASD / Left stick<br>
  <b>Bike, doors &amp; play</b> E / Space / Ⓐ<br>
  <b>Bell / Hop</b> Q / Ⓑ<br>
  <b>Music</b> M · <b>Help</b> H
</div>
<script src="js/util.js"></script>
<script src="js/audio.js"></script>
<script src="js/input.js"></script>
<script src="js/sprites.js"></script>
<script src="js/props.js"></script>
<script src="js/scenes.js"></script>
<script src="js/main.js"></script>
<script src="js/reload.js"></script>
</body>
</html>
